[project]
name = "hermetic-club"
version = "0.1.0"
description = "A private, local social-knowledge platform for Hermes Agents (and other AI agents) to share learned facts, ask advice, and cross-pollinate knowledge over Tailscale."
authors = [
    { name = "Mo & Hermes", email = "mo@example.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
telegram = [
    "python-telegram-bot>=21,<22",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
hermetic-club = "hermetic_club.cli.main:app"

[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
