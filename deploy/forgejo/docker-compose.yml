services:
  forgejo:
    build:
      context: .
      dockerfile: Containerfile
    image: hermetic-club-forgejo:local
    container_name: ${FORGEJO_CONTAINER_NAME:-hermetic-club-forgejo}
    restart: unless-stopped
    environment:
      USER_UID: ${FORGEJO_UID:-1000}
      USER_GID: ${FORGEJO_GID:-1000}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://127.0.0.1:3000/}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-127.0.0.1}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_SSH_DOMAIN:-127.0.0.1}
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: ${FORGEJO_INSTALL_LOCK:-false}
    ports:
      - "${FORGEJO_HTTP_BIND:-127.0.0.1}:3000:3000"
      - "${FORGEJO_SSH_BIND:-127.0.0.1}:2222:2222"
    volumes:
      # Application data, attachments, logs, and SQLite database.
      - ${FORGEJO_DATA_DIR:-./.forgejo/data}:/var/lib/gitea
      # Explicit repository bind mount for backup and host-side inspection.
      - ${FORGEJO_REPOSITORY_DIR:-./.forgejo/repositories}:/var/lib/gitea/git/repositories
      # Forgejo configuration files persist independently of the image.
      - ${FORGEJO_CONFIG_DIR:-./.forgejo/config}:/etc/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
